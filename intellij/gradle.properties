org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
# The platform provides the Kotlin standard library at run time.
kotlin.stdlib.default.dependency=false
# Compile Kotlin in Gradle's own process rather than a separate Kotlin daemon.
kotlin.compiler.execution.strategy=in-process
# The plugin's version; docs/RELEASING.md says how a release changes it. A version with a
# suffix (0.2.0-beta.1) is published to the Marketplace channel the suffix names (beta).
pluginVersion=0.1.0
