name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  bazel:
    name: Bazel (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.os }}
          repository-cache: true
      - name: Test
        run: bazel test --config=ci //...
      - name: Run the CLI
        run: bazel run --config=ci //cli:ktrapic

  format:
    name: ktfmt
    runs-on: ubuntu-latest
    env:
      KTFMT_VERSION: "0.64"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Check formatting
        run: |
          curl -sSfL -o ktfmt.jar "https://repo1.maven.org/maven2/com/facebook/ktfmt/${KTFMT_VERSION}/ktfmt-${KTFMT_VERSION}-with-dependencies.jar"
          git ls-files -z '*.kt' '*.kts' | xargs -0 --no-run-if-empty java -jar ktfmt.jar --dry-run --set-exit-if-changed
