name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  bazel:
    name: Bazel (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.os }}
          repository-cache: true
      - name: Test
        run: bazel test --config=ci //...
      - name: Run the CLI
        run: bazel run --config=ci //cli:ktrapic

  format:
    name: ktfmt
    runs-on: ubuntu-latest
    env:
      KTFMT_VERSION: "0.64"
      KTFMT_SHA256: 5b3d5286fd2defcc7dc8e28c21ddf156cc6b2d8682bdcd929ce4333e7a6201f2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Check formatting
        run: |
          curl -sSfL -o ktfmt.jar "https://repo1.maven.org/maven2/com/facebook/ktfmt/${KTFMT_VERSION}/ktfmt-${KTFMT_VERSION}-with-dependencies.jar"
          echo "${KTFMT_SHA256}  ktfmt.jar" | sha256sum --check
          git ls-files -z '*.kt' '*.kts' ':!:test/cases/*' | xargs -0 --no-run-if-empty java -jar ktfmt.jar --dry-run --set-exit-if-changed
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test the playground's annotation code
        run: |
          node --version
          node --test playground/*.test.mjs

  mod:
    name: Mod (build, and test on the packaged runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Fetch the stand-in game DLLs (Git LFS, in the Template submodule)
        run: git submodule foreach git lfs pull
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-mod
          repository-cache: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build the daemon jar
        run: bazel build --config=ci //daemon:ktrapic-daemon_deploy.jar
      - name: Package the Java runtime
        run: |
          mod/package-runtime.sh "$RUNNER_TEMP/runtime.zip"
          mkdir "$RUNNER_TEMP/runtime" && unzip -q "$RUNNER_TEMP/runtime.zip" -d "$RUNNER_TEMP/runtime"
          chmod +x "$RUNNER_TEMP"/runtime/bin/*
      - name: Build the mod
        run: dotnet build -c Release mod/KTrapIC.csproj
      - name: Install the mod from the checkout into a scratch mods directory
        run: |
          mods="$RUNNER_TEMP/mods" game="$RUNNER_TEMP/game"
          jar="$mods/KTrapIC/compiler/ktrapic-daemon.jar"
          cfg="$game/BepInEx/config/com.github.subitan.stationeers-ktrapic.cfg"
          mkdir -p "$mods/KTrapIC/compiler" "$game/BepInEx/config"
          # A compiler and setting as --local-compiler leaves them (on Windows), for the plain install to remove.
          echo jar > "$jar"
          printf '[Development]\n\nDaemonJarPath = %s\n' "$jar" > "$cfg"
          STATIONEERS_DIR="$game" bazel run --config=ci //mod:install -- "$mods"
          test -f "$mods/KTrapIC/KTrapIC.dll"
          test -f "$mods/KTrapIC/About/About.xml"
          test ! -e "$mods/KTrapIC/compiler"
          grep -qxF "DaemonJarPath = " "$cfg"
          status=0
          STATIONEERS_DIR="$game" bazel run --config=ci //mod:install -- "$mods" --local-compiler \
            2> "$RUNNER_TEMP/refusal.txt" || status=$?
          if [ "$status" -ne 1 ] || ! grep -qF "works only on Windows" "$RUNNER_TEMP/refusal.txt"; then
            cat "$RUNNER_TEMP/refusal.txt"
            echo "--local-compiler should be refused off Windows (1), not $status"; exit 1
          fi
          test ! -e "$mods/KTrapIC/compiler"
          grep -qxF "DaemonJarPath = " "$cfg"
          status=0
          bazel run --config=ci //mod:install || status=$?
          if [ "$status" -ne 2 ]; then
            echo "Installing without a mods directory should fail with a usage error (2), not $status"; exit 1
          fi
      - name: Test the daemon client, running the daemon on the packaged runtime
        run: |
          JAVA_HOME="$RUNNER_TEMP/runtime" \
          KTRAPIC_DAEMON_JAR="$PWD/$(bazel cquery --config=ci --output=files //daemon:ktrapic-daemon_deploy.jar 2>/dev/null)" \
          dotnet test mod/tests/KTrapIC.Tests.csproj

  intellij:
    name: IntelliJ plugin (build, and test against the daemon)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-intellij
          repository-cache: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the daemon jar
        run: |
          bazel build --config=ci //daemon:ktrapic-daemon_deploy.jar
          echo "KTRAPIC_DAEMON_JAR=$PWD/$(bazel cquery --config=ci --output=files //daemon:ktrapic-daemon_deploy.jar 2>/dev/null)" >> "$GITHUB_ENV"
      - name: Build and test the plugin
        working-directory: intellij
        run: bash ./gradlew --no-daemon buildPlugin test
      - uses: actions/upload-artifact@v4
        with:
          name: ktrapic-intellij
          path: intellij/build/distributions/*.zip
