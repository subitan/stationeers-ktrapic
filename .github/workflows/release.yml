name: Release

# Publishes the IC10 Editor plugin and what it downloads on first use: the compile daemon jar and a
# trimmed Java runtime for it. A push to main replaces the rolling "dev" prerelease, which Debug
# builds of the plugin use; a tag vX.Y.Z (matching mod/About/About.xml) publishes that release,
# which Release builds of plugin version X.Y.Z use.

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  daemon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true
      - name: Build the daemon jar
        run: |
          bazel build --config=ci //daemon:ktrapic-daemon_deploy.jar
          mkdir out && cp "$(bazel cquery --config=ci --output=files //daemon:ktrapic-daemon_deploy.jar 2>/dev/null)" out/ktrapic-daemon.jar
      - uses: actions/upload-artifact@v4
        with:
          name: daemon
          path: out/ktrapic-daemon.jar

  runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Package the Java runtime
        shell: bash
        run: mod/package-runtime.sh out/ktrapic-runtime-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: runtime
          path: out/ktrapic-runtime-windows-x64.zip

  mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Fetch the stand-in game DLLs (Git LFS, in the Template submodule)
        run: git submodule foreach git lfs pull
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build the plugin
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' mod/About/About.xml)
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "Tag $GITHUB_REF_NAME doesn't match mod/About/About.xml's version $version" >&2
              exit 1
            fi
            configuration=Release
          else
            # A Debug build downloads from the rolling dev release.
            configuration=Debug
          fi
          dotnet build -c "$configuration" -t:Dist mod/KTrapIC.csproj
          mkdir out && (cd mod/dist && zip -qr "../../out/KTrapIC-$GITHUB_REF_NAME.zip" KTrapIC)
      - uses: actions/upload-artifact@v4
        with:
          name: mod
          path: out/*.zip

  publish:
    needs: [daemon, runtime, mod]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish the release
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            gh release create "$GITHUB_REF_NAME" --title "KTrapIC $GITHUB_REF_NAME" --generate-notes assets/*
          else
            gh release delete dev --yes --cleanup-tag || true
            gh release create dev --prerelease --target "$GITHUB_SHA" --title "KTrapIC dev (main)" \
              --notes "Built from main at $GITHUB_SHA. Debug builds of the plugin download from this release." assets/*
          fi
