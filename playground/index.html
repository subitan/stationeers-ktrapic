<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KTrapIC Playground</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --border: #d9dde3; --text: #1d2330; --muted: #677085;
    --accent: #c4680f; --error-bg: #fdecec; --error: #b42318; --ok: #1b7f4b; --gutter: #eef0f4;
    --warn: #8a5300; --warn-bg: #fff4dc;
    --hl-instr: #8a6d00; --hl-reg: #1f5fbf; --hl-dev: #2b8a3e; --hl-label: #8e3bb0;
    --hl-num: #0f7f86; --hl-comment: #8b93a3; --hl-logic: #b85c00; --hl-str: #b8325a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1a1e26; --border: #2c323e; --text: #dfe3ea; --muted: #8c95a8;
      --accent: #f08c2e; --error-bg: #3a1d1d; --error: #ff8a80; --ok: #5cd08d; --gutter: #161a21;
      --warn: #ffc65c; --warn-bg: #3a2e14;
      --hl-instr: #ffdd57; --hl-reg: #5fa8ff; --hl-dev: #5fdc6b; --hl-label: #c77dea;
      --hl-num: #3cc9c9; --hl-comment: #6f7889; --hl-logic: #ff9b42; --hl-str: #ff7aa2;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
    padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  h1 { font-size: 16px; margin: 0; font-weight: 650; }
  h1 span { color: var(--accent); }
  .version { color: var(--muted); font-size: 12px; }
  .spacer { flex: 1; }
  select, button {
    font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; cursor: pointer;
  }
  button:hover, select:hover { border-color: var(--accent); }
  .options { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); }
  .options label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; white-space: nowrap; }
  main {
    flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px 16px;
  }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }
  .pane {
    display: flex; flex-direction: column; min-height: 0; min-width: 0;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
  }
  .pane-head {
    display: flex; align-items: center; gap: 10px; padding: 6px 10px;
    border-bottom: 1px solid var(--border); font-size: 12px; color: var(--muted);
  }
  .pane-head strong { color: var(--text); font-size: 13px; }
  .code {
    flex: 1; min-height: 0; display: flex; overflow: hidden;
    font: 13px/20px ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  .gutter {
    flex: none; padding: 8px 8px 8px 10px; text-align: right; color: var(--muted);
    background: var(--gutter); user-select: none; overflow: hidden; min-width: 44px; white-space: pre;
  }
  .gutter .err { color: #fff; background: var(--error); border-radius: 3px; padding: 0 3px; }
  .gutter .over { color: var(--error); }
  textarea, pre {
    flex: 1; margin: 0; padding: 8px 10px; border: 0; outline: 0; resize: none;
    font: inherit; color: var(--text); background: transparent; tab-size: 4;
    white-space: pre; overflow: auto;
  }
  pre { cursor: text; user-select: text; }
  .stats { display: flex; gap: 12px; margin-left: auto; }
  .stats .bad { color: var(--error); font-weight: 600; }
  .status {
    padding: 6px 10px; border-top: 1px solid var(--border); font-size: 12px; min-height: 30px;
    color: var(--ok); white-space: pre-wrap; max-height: 30%; overflow: auto;
  }
  .status.error { color: var(--error); background: var(--error-bg); }
  .status.warn { color: var(--warn); background: var(--warn-bg); }
  .status a { color: inherit; }
  .t-instr { color: var(--hl-instr); } .t-reg { color: var(--hl-reg); } .t-dev { color: var(--hl-dev); }
  .t-label { color: var(--hl-label); } .t-num { color: var(--hl-num); } .t-comment { color: var(--hl-comment); }
  .t-logic { color: var(--hl-logic); } .t-str { color: var(--hl-str); }
</style>
</head>
<body>
<header>
  <h1>K<span>TrapIC</span> Playground</h1>
  <span class="version" id="version"></span>
  <select id="open" aria-label="Open a program"><option value="">Open…</option></select>
  <div class="options" id="options">
    <label title="Resolve labels to line numbers and drop them, saving lines on the chip"><input type="checkbox" data-opt="compact" checked> Compact</label>
  </div>
  <span class="spacer"></span>
  <button id="download" title="Save the KTrapIC program to a file">Save .ic10.kts</button>
</header>
<main>
  <section class="pane">
    <div class="pane-head"><strong>Kotlin</strong><span id="filename">untitled.ic10.kts</span>
      <span class="stats">Ctrl+S saves · Tab indents</span></div>
    <div class="code">
      <div class="gutter" id="src-gutter"></div>
      <textarea id="src" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
    </div>
    <div class="status" id="status">Ready.</div>
  </section>
  <section class="pane">
    <div class="pane-head"><strong>IC10</strong>
      <span class="stats">
        <span id="st-lines"></span><span id="st-bytes"></span><span id="st-regs"></span>
      </span>
      <button id="copy">Copy</button></div>
    <div class="code">
      <div class="gutter" id="out-gutter"></div>
      <pre id="out"></pre>
    </div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const src = $("src"), out = $("out");
const MAX_LINES = 128, MAX_BYTES = 4096, MAX_REGS = 16;
const DRAFT_KEY = "ktrapic-playground-draft";
const NAME_KEY = "ktrapic-playground-name";
const DEFAULT_CODE = `import ktrapic.*

// Point a solar panel (d1) at the sun, using a daylight sensor (d0).
val sensor = d0
while (true) {
    d1.Horizontal = sensor.Horizontal
    d1.Vertical = 90.0 - sensor.Vertical
    sleep(0.5)
}
`;

let compiled = "", errorLine = null, timer = null, seq = 0;

function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

function gutter(el, n, opts = {}) {
  let s = "";
  for (let i = 1; i <= Math.max(n, 1); i++) {
    if (i === opts.err) s += `<span class="err">${i}</span>\n`;
    else if (opts.limit && i > opts.limit) s += `<span class="over">${i}</span>\n`;
    else s += i + "\n";
  }
  el.innerHTML = s;
}

function esc(s) { return s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]); }

function highlightLine(line) {
  const hash = line.indexOf("#");
  const body = hash >= 0 ? line.slice(0, hash) : line;
  const comment = hash >= 0 ? line.slice(hash) : "";
  let html = "", first = true;
  for (const part of body.split(/(\s+)/)) {
    if (!part || /^\s+$/.test(part)) { html += part; continue; }
    let cls;
    if (/:$/.test(part)) cls = "t-label";
    else if (first) cls = "t-instr";
    else if (/^(r\d+|r\d+r\d+|sp|ra)$/.test(part)) cls = "t-reg";
    else if (/^(d\d|db|d\d:\d|dr\d+)$/.test(part)) cls = "t-dev";
    else if (/^(-?\d+(\.\d+)?|\$[0-9A-F]+|%[01]+)$/i.test(part)) cls = "t-num";
    else if (/^(STR|HASH)\(/.test(part)) cls = "t-str";
    else if (/^[A-Z]/.test(part)) cls = "t-logic";
    else cls = "t-label";
    html += `<span class="${cls}">${esc(part)}</span>`;
    first = false;
  }
  return html + (comment ? `<span class="t-comment">${esc(comment)}</span>` : "");
}

function options() {
  const o = {};
  document.querySelectorAll("[data-opt]").forEach((cb) => (o[cb.dataset.opt] = cb.checked));
  return o;
}

function setStat(id, label, value, max) {
  const el = $(id);
  el.textContent = `${label} ${value}/${max}`;
  el.className = value > max ? "bad" : "";
}

function setStatus(msg, kind) {
  const st = $("status");
  st.className = "status" + (kind === "warn" ? " warn" : kind ? " error" : "");
  st.innerHTML = msg;
}

async function compile() {
  const mine = ++seq;
  const code = src.value;
  store(DRAFT_KEY, code);
  let res;
  try {
    const r = await fetch("/api/compile", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "compile", code: { "": code }, options: options() }),
    });
    res = await r.json();
  } catch (e) {
    if (mine === seq) setStatus("Can't reach the local server — is playground.main.kts still running?", true);
    return;
  }
  if (mine !== seq) return;

  if (res.error) {
    const e = res.error;
    errorLine = e.line || null;
    const where = errorLine ? ` <a href="#" id="goto">line ${errorLine}${e.column ? ":" + e.column : ""}</a>` : "";
    const more = (e.errors || []).slice(1).map((x) => `\n${esc(x.description)} (line ${x.line}:${x.column})`).join("");
    setStatus(esc(e.description) + where + more + (e.stack_trace ? "\n\n" + esc(e.stack_trace) : ""), true);
    const g = $("goto");
    if (g) g.onclick = (ev) => { ev.preventDefault(); gotoLine(errorLine); };
    out.style.opacity = 0.45;
  } else {
    errorLine = null;
    compiled = res.code || "";
    const lines = compiled ? compiled.replace(/\n$/, "").split("\n") : [];
    out.innerHTML = lines.map(highlightLine).join("\n");
    out.style.opacity = 1;
    gutter($("out-gutter"), lines.length, { limit: MAX_LINES });
    const bytes = res.num_bytes ?? new Blob([compiled]).size;
    setStat("st-lines", "lines", res.num_lines ?? lines.length, MAX_LINES);
    setStat("st-bytes", "bytes", bytes, MAX_BYTES);
    setStat("st-regs", "registers", res.num_registers ?? 0, MAX_REGS);
    if (res.warnings && res.warnings.length) {
      setStatus(res.warnings.map((w) => `${esc(w.description)} (line ${w.line}:${w.column})`).join("\n"), "warn");
    }
    else setStatus("Compiled OK.", false);
  }
  gutter($("src-gutter"), src.value.split("\n").length, { err: errorLine });
}

function schedule() {
  gutter($("src-gutter"), src.value.split("\n").length, { err: errorLine });
  clearTimeout(timer);
  timer = setTimeout(compile, 250);
}

function gotoLine(n) {
  const lines = src.value.split("\n");
  const pos = lines.slice(0, n - 1).reduce((a, l) => a + l.length + 1, 0);
  src.focus();
  src.setSelectionRange(pos, pos + (lines[n - 1] || "").length);
  src.scrollTop = Math.max(0, (n - 5) * 20);
}

src.addEventListener("input", schedule);
src.addEventListener("scroll", () => ($("src-gutter").scrollTop = src.scrollTop));
out.addEventListener("scroll", () => ($("out-gutter").scrollTop = out.scrollTop));
src.addEventListener("keydown", (e) => {
  if (e.key === "Tab") {
    e.preventDefault();
    const { selectionStart: s, selectionEnd: en } = src;
    src.setRangeText("    ", s, en, "end");
    schedule();
  } else if ((e.ctrlKey || e.metaKey) && e.key === "s") {
    e.preventDefault();
    download();
  }
});
document.querySelectorAll("[data-opt]").forEach((cb) => {
  cb.checked = (load("opt-" + cb.dataset.opt) ?? String(cb.checked)) === "true";
  cb.addEventListener("change", () => { store("opt-" + cb.dataset.opt, cb.checked); compile(); });
});

$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(compiled); $("copy").textContent = "Copied"; }
  catch (e) { $("copy").textContent = "Copy failed"; }
  setTimeout(() => ($("copy").textContent = "Copy"), 1200);
};

function download() {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([src.value], { type: "text/plain" }));
  a.download = $("filename").textContent;
  a.click();
  URL.revokeObjectURL(a.href);
}
$("download").onclick = download;

$("open").onchange = async (e) => {
  const v = e.target.value;
  e.target.value = "";
  if (!v) return;
  const { group, name } = JSON.parse(v);
  const r = await fetch(`/api/source?group=${encodeURIComponent(group)}&name=${encodeURIComponent(name)}`);
  if (!r.ok) { setStatus("Couldn't open " + esc(name), true); return; }
  src.value = (await r.json()).code;
  $("filename").textContent = name;
  store(NAME_KEY, name);
  src.scrollTop = 0;
  compile();
};

(async function init() {
  src.value = load(DRAFT_KEY) ?? DEFAULT_CODE;
  // Programs are named *.ic10.kts; a stored name without that suffix gets it.
  const name = load(NAME_KEY) ?? "untitled.ic10.kts";
  $("filename").textContent = name.endsWith(".ic10.kts") ? name : name.replace(/\.kts$/, "") + ".ic10.kts";
  try {
    const info = await (await fetch("/api/info")).json();
    $("version").textContent = "compiler v" + info.version;
    for (const [group, names] of Object.entries(info.sources)) {
      if (!names.length) continue;
      const og = document.createElement("optgroup");
      og.label = group.split(/[\\/]/).slice(-3).join("/");
      for (const name of names) {
        const o = document.createElement("option");
        o.value = JSON.stringify({ group, name });
        o.textContent = name;
        og.appendChild(o);
      }
      $("open").appendChild(og);
    }
  } catch (e) {}
  compile();
})();
</script>
</body>
</html>
