<svg xmlns="http://www.w3.org/2000/svg" width="1232" height="706" viewBox="0 0 1232 706">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2230"/>
      <stop offset="1" stop-color="#0b0e14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#7f52ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7f52ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kt" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#e44857"/>
      <stop offset="0.5" stop-color="#c711e1"/>
      <stop offset="1" stop-color="#7f52ff"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a616c"/>
      <stop offset="1" stop-color="#3a4049"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b525c"/>
      <stop offset="1" stop-color="#2a2f36"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1a17"/>
      <stop offset="1" stop-color="#08100e"/>
    </linearGradient>
    <pattern id="hazard" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="28" height="28" fill="#e8a317"/>
      <rect width="14" height="28" fill="#1d1f22"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1232" height="706" fill="url(#bg)"/>
  <rect width="1232" height="706" fill="url(#glow)"/>
  <!-- faint grid of a station floor -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 520 H1232 M0 580 H1232 M0 640 H1232 M0 700 H1232"/>
    <path d="M116 706 L300 470 M316 706 L440 470 M516 706 L570 470 M716 706 L662 470 M916 706 L792 470 M1116 706 L932 470"/>
  </g>

  <g transform="translate(110 0)">
  <!-- shadow -->
  <ellipse cx="616" cy="640" rx="400" ry="34" fill="#000" opacity="0.55" filter="url(#soft)"/>

  <!-- lid -->
  <g>
    <rect x="276" y="70" width="680" height="440" rx="22" fill="url(#lid)" stroke="#20242a" stroke-width="4"/>
    <!-- corner bumpers -->
    <g fill="#e8a317" stroke="#7a5609" stroke-width="2">
      <path d="M276 128 V92 a22 22 0 0 1 22 -22 H334 V92 H298 V128 Z"/>
      <path d="M956 128 V92 a22 22 0 0 0 -22 -22 H898 V92 H934 V128 Z"/>
    </g>
    <!-- screws -->
    <g fill="#2a2f36" stroke="#8a919b" stroke-width="2">
      <circle cx="306" cy="488" r="7"/><circle cx="926" cy="488" r="7"/>
    </g>
    <!-- bezel and screen -->
    <rect x="312" y="104" width="608" height="376" rx="10" fill="#15181d"/>
    <rect x="326" y="118" width="580" height="348" rx="6" fill="url(#screen)"/>
    <!-- screen text -->
    <g xml:space="preserve" font-family="Consolas, 'Cascadia Code', 'DejaVu Sans Mono', monospace" font-size="21">
      <text x="346" y="152" fill="#5e6b78">// thermostat.ic10.kts</text>
      <text x="346" y="186"><tspan fill="#cc7832">import</tspan><tspan fill="#d6dde6"> ktrapic.*</tspan></text>
      <text x="346" y="226"><tspan fill="#cc7832">while</tspan><tspan fill="#d6dde6"> (</tspan><tspan fill="#cc7832">true</tspan><tspan fill="#d6dde6">) {</tspan></text>
      <text x="369" y="258"><tspan fill="#cc7832">val</tspan><tspan fill="#d6dde6"> t = d0.</tspan><tspan fill="#9876aa">Temperature</tspan></text>
      <text x="369" y="290"><tspan fill="#d6dde6">d1.</tspan><tspan fill="#9876aa">On</tspan><tspan fill="#d6dde6"> = t &lt; </tspan><tspan fill="#6897bb">290.0</tspan></text>
      <text x="369" y="322"><tspan fill="#d6dde6">d2.</tspan><tspan fill="#9876aa">On</tspan><tspan fill="#d6dde6"> = t &gt; </tspan><tspan fill="#6897bb">300.0</tspan></text>
      <text x="369" y="354"><tspan fill="#ffc66d">yield</tspan><tspan fill="#d6dde6">()</tspan></text>
      <text x="346" y="386" fill="#d6dde6">}</text>
      <text x="346" y="436" fill="#3fbf7f" font-size="18">✔ compiled to IC10</text>
      <rect x="370" y="371" width="12" height="20" fill="#3fbf7f" opacity="0.8"/>
    </g>
    <!-- Kotlin-coloured badge on the screen -->
    <g transform="translate(796 140)">
      <rect width="92" height="92" rx="14" fill="url(#kt)"/>
      <text x="46" y="66" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="58" fill="#ffffff">kt</text>
    </g>
    <!-- screen glare -->
    <path d="M326 118 H620 L480 466 H326 Z" fill="#ffffff" opacity="0.025"/>
  </g>

  <!-- hinge -->
  <rect x="300" y="506" width="632" height="16" rx="6" fill="#23272d"/>

  <!-- base -->
  <path d="M240 520 H992 L1036 600 a14 14 0 0 1 -12 20 H208 a14 14 0 0 1 -12 -20 Z" fill="url(#base)" stroke="#1c1f24" stroke-width="4"/>
  <rect x="216" y="604" width="800" height="14" rx="4" fill="url(#hazard)" opacity="0.9"/>
  <!-- keyboard -->
  <g fill="#262a30" stroke="#151719" stroke-width="1.5">
    <rect x="300" y="532" width="632" height="18" rx="3"/>
    <rect x="290" y="554" width="652" height="18" rx="3"/>
    <rect x="280" y="576" width="672" height="18" rx="3"/>
  </g>
  <g stroke="#151719" stroke-width="2">
    <path d="M340 532 v18 M380 532 v18 M420 532 v18 M460 532 v18 M500 532 v18 M540 532 v18 M580 532 v18 M620 532 v18 M660 532 v18 M700 532 v18 M740 532 v18 M780 532 v18 M820 532 v18 M860 532 v18 M900 532 v18"/>
    <path d="M332 554 v18 M374 554 v18 M416 554 v18 M458 554 v18 M500 554 v18 M542 554 v18 M584 554 v18 M626 554 v18 M668 554 v18 M710 554 v18 M752 554 v18 M794 554 v18 M836 554 v18 M878 554 v18 M920 554 v18"/>
    <path d="M400 576 v18 M832 576 v18"/>
  </g>
  <!-- status LEDs -->
  <circle cx="960" cy="540" r="5" fill="#3fbf7f"/>
  <circle cx="978" cy="540" r="5" fill="#e8a317"/>

  </g>

  <!-- title -->
  <g font-family="'Segoe UI', Arial, sans-serif">
    <text x="56" y="96" font-size="64" font-weight="800" fill="#ffffff">K<tspan fill="#e8a317">TrapIC</tspan></text>
    <text x="58" y="134" font-size="24" fill="#aab3c0">Kotlin for IC10 chips</text>
  </g>
</svg>
